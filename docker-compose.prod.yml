# The PRODUCTION stack. `docker-compose.yml` is the development one.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# What differs, and why each one matters:
#
#   * The frontend is a BUILT BUNDLE served by nginx, not a dev server. nginx
#     also proxies /api to the backend, which is what reproduces Vite's dev
#     proxy — without it the bundle has no route to the API at all, because the
#     client calls /api on its own origin by design.
#   * No source mounts. The image is the artifact; a bind mount would mean the
#     thing you tested is not the thing that runs.
#   * No hot reload, and the backend runs as an unprivileged user.
#   * restart: unless-stopped everywhere, so a crash or a reboot recovers.
#   * Healthchecks on everything, including the worker, which has no HTTP port
#     and so proves liveness by touching a file once per loop pass.
#   * The migrate step also seeds the chart of accounts, which is required
#     setup rather than sample data — but NOT the demo recipients or the
#     opening balance, which default off here and on in development.
#
# Still missing, deliberately, because they depend on where you deploy: TLS
# (terminate it at your platform's load balancer or put Caddy in front),
# secrets management, log shipping, and backups.
name: payout-ledger-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER_is_required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB_is_required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately NOT published. Nothing outside this network needs it, and the
    # development stack exposing 5434 is a convenience, not a pattern to copy.

  # Runs to completion before anything else starts. A failed migration stops the
  # deploy here rather than leaving a half-started app pointed at the wrong
  # schema.
  #
  # Seeds as well as migrates, and the seeding is not optional: the chart of
  # accounts (a program funding account and a provider settlement account) has
  # to exist before any transfer can be authorized, so a stack that skipped it
  # would start cleanly and then refuse every disbursement. The seeder is
  # idempotent, so running it on every deploy is a no-op after the first.
  #
  # SEED_DEMO_DATA defaults to FALSE here and true in development. Sample
  # recipients and a million-dollar opening balance are exactly what you
  # want in a demo and exactly what you do not want on a real deployment.
  migrate:
    build:
      context: ./backend
      target: production
    restart: 'no'
    command: ['sh', '-c', 'alembic upgrade head && python -m app.seed']
    environment:
      DATABASE_URL: &database_url >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: *database_url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: ['python', '-m', 'app.worker']
    # Two, so the claim is contended for real. `for update skip locked` is the
    # property the whole queue rests on, and with one worker it is never tested
    # by anything but the suite: two take different rows from the same payment
    # run, and a regression would show as one payment sent twice. Cheap — each
    # is one Python process and one LISTEN connection.
    deploy:
      replicas: 2
    environment:
      DATABASE_URL: *database_url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    healthcheck:
      # "Did a loop pass finish in the last two minutes." A process-liveness
      # check would be theatre — Docker restarts a process that exits anyway —
      # and this catches the case that actually needs catching: alive but stuck.
      test: ['CMD-SHELL', 'find /tmp/worker-alive -mmin -2 | grep -q .']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      # The interface is a variable as well as the port. With a TLS proxy on the
      # same host (Caddy, as scripts/deploy.sh sets up) this must be 127.0.0.1:
      # published on 0.0.0.0, the plain-HTTP port stays reachable from outside
      # even behind a firewall, because Docker writes its own iptables rules
      # ahead of ufw's.
      - '${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
