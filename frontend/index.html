<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payout Ledger</title>
    <!--
      Runs before the bundle, and before anything paints. Without it the page
      renders light, then React mounts, `useTheme` resolves the preference and
      it flips — a white flash on every load for anyone using dark, which is
      the one thing a theme toggle must not do.

      It cannot import `useTheme`, so it repeats that hook's rule: an absent
      key means "follow the OS". Keep the two in step.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
