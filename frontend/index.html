<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payout Ledger</title>
    <!-- The same mark as nickjmorrow.com, so the tab says whose work this is. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="A disbursement console for unconditional cash transfers: pay one recipient or a whole payment run, watch each payment clear a queue and a mock provider live, and open the double-entry books behind any transfer."
    />

    <!-- Link previews (Slack, LinkedIn, iMessage…). Scrapers need absolute
         URLs, so these name the public demo; change them if you deploy
         somewhere else. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Payout Ledger" />
    <meta property="og:title" content="Payout Ledger" />
    <meta
      property="og:description"
      content="Cash transfers on double-entry books — and no payment ever goes out twice. A live demo with mock money."
    />
    <meta property="og:url" content="https://ledger.nickjmorrow.com/" />
    <meta property="og:image" content="https://ledger.nickjmorrow.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Payout Ledger's console after a 24-recipient payment run, every transfer succeeded and the books balanced."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Runs before the bundle, and before anything paints. Without it the page
      renders light, then React mounts, `useTheme` resolves the preference and
      it flips — a white flash on every load for anyone using dark, which is
      the one thing a theme toggle must not do.

      It cannot import `useTheme`, so it repeats that hook's rule: an absent
      key means "follow the OS". Keep the two in step.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
