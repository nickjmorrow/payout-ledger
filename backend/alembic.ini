# Alembic, configured as little as possible.
#
# The database URL is deliberately NOT here. It lives on Settings like every
# other environment-dependent value (AGENTS.md § Configuration), and alembic/env.py
# reads it from there — so there is one answer to "where does this connect", and
# committing a URL to the repo is not one of the ways to get it wrong.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Revision filenames sort chronologically, which makes `ls versions/` a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# Alembic's logging config is left out on purpose: app/logging.py owns logging,
# and a second opinion here would fight it.
